version: "3.9"

services:
  # PostgreSQL with AGE (graph) + pgvector (embeddings)
  # Build a combined image since no official combined image exists.
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.testdb
    environment:
      POSTGRES_USER: goose
      POSTGRES_PASSWORD: goose
      POSTGRES_DB: goose_context
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goose -d goose_context"]
      interval: 5s
      timeout: 5s
      retries: 10
