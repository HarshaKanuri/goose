[package]
name = "goose-context"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Three-tier context management for Goose (graph, vector, relational) on PostgreSQL"

[lints]
workspace = true

[dependencies]
# Workspace deps
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

# PostgreSQL
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
deadpool-postgres = { version = "0.14" }
postgres-types = { version = "0.2", features = ["derive"] }

# pgvector support
pgvector = { version = "0.4", features = ["postgres"] }


# MCP server
rmcp = { workspace = true, features = ["server", "transport-io", "macros"] }
schemars = { workspace = true }

# Embedding (API-based provider)
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots"], default-features = false }

# Utilities
regex = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
